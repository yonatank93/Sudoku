<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body data-initial-solved="{{ 'true' if is_solved else 'false' }}">
    <script id="initialState" type="application/json">{{ {
        "solution": solution,
        "original_puzzle": original_puzzle,
        "is_solved": is_solved,
        "error_message": error_message or ""
    } | tojson }}</script>

    <div class="app-shell">
        <header class="app-header">
            <div class="brand">
                <h1>Sudoku</h1>
                <p class="subtitle">Play, explore custom dimensions, or watch the solver work.</p>
            </div>
            <div class="header-actions">
                <button type="button" id="themeToggle" class="btn btn-ghost" aria-label="Toggle dark mode">
                    Dark Mode
                </button>
            </div>
        </header>

        <section class="panel controls-panel" aria-label="Puzzle controls">
            <div class="control-row">
                <div class="control-group">
                    <label for="boardSize">Board Size</label>
                    <select id="boardSize">
                        <option value="4x4">4×4 (2×2 blocks)</option>
                        <option value="6x6">6×6 (2×3 blocks)</option>
                        <option value="8x8">8×8 (2×4 blocks)</option>
                        <option value="9x9" selected>9×9 (3×3 blocks)</option>
                        <option value="16x16">16×16 (4×4 hex)</option>
                        <option value="custom">Custom…</option>
                    </select>
                </div>

                <div class="control-group difficulty-group">
                    <div class="label-row">
                        <label for="difficulty">Difficulty</label>
                        <span id="difficultyLabel" class="badge">3 — Medium</span>
                    </div>
                    <input type="range" id="difficulty" min="1" max="5" value="3" step="1">
                </div>

                <div class="control-group generate-group">
                    <button type="button" id="generateProblem" class="btn btn-primary">
                        Generate Puzzle
                    </button>
                </div>
            </div>

            <div id="customConfig" class="custom-config hidden">
                <div class="control-group">
                    <label for="customSymbols">Allowed Symbols</label>
                    <input type="text" id="customSymbols" value="123456" placeholder="e.g. 123456 or A,B,C,D">
                </div>
                <div class="control-group small-input">
                    <label for="customBlockRows">Block Rows</label>
                    <input type="number" id="customBlockRows" min="1" max="16" value="2">
                </div>
                <div class="control-group small-input">
                    <label for="customBlockCols">Block Cols</label>
                    <input type="number" id="customBlockCols" min="1" max="16" value="3">
                </div>
                <div class="control-group">
                    <button type="button" id="applyCustom" class="btn btn-secondary">Apply</button>
                </div>
            </div>
        </section>

        <main class="board-stage">
            <div id="boardContainer" class="board-container">
                <div id="sudokuBoard" class="sudoku-board" role="grid" aria-label="Sudoku board"></div>
            </div>

            <p id="solutionMessage"
               class="status-message{% if error_message %} status-error{% endif %}"
               role="status"
               aria-live="polite">{{ error_message or '' }}</p>

            <div class="action-bar">
                <button type="button" id="checkSolution" class="btn btn-secondary">Check Solution</button>
                <button type="button" id="clearInput" class="btn btn-ghost">Clear Input</button>
                <button type="button" id="solveBtn" class="btn btn-accent">Solve</button>
                <button type="button" id="resetAll" class="btn btn-danger">Reset All</button>
            </div>
        </main>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
