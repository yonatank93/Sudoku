<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body data-initial-solved="{{ 'true' if is_solved else 'false' }}" data-mode="{{ app_mode|default('flask') }}">
    <script id="initialState" type="application/json">{{ {
        "solution": solution,
        "original_puzzle": original_puzzle,
        "is_solved": is_solved,
        "error_message": error_message or ""
    } | tojson }}</script>

    <div class="app-shell">
        <header class="app-header">
            <div class="brand">
                <h1>Sudoku</h1>
                <p class="subtitle">Play, explore custom dimensions, or watch the solver work.</p>
            </div>
            <div class="header-actions">
                <button type="button" id="ioToggleBtn" class="btn btn-ghost">
                    Import / Export
                </button>
                <button type="button" id="themeToggle" class="btn btn-ghost" aria-label="Toggle dark mode">
                    Dark Mode
                </button>
            </div>
        </header>

        <section id="ioPanel" class="panel io-panel hidden" aria-label="Import or export puzzle">
            <div class="control-group">
                <label for="puzzleText">Puzzle Text (one row per line; use 0, _, -, or . for empty cells)</label>
                <textarea id="puzzleText" rows="5" placeholder="Paste puzzle rows here or click Copy Board…"></textarea>
            </div>
            <div class="io-actions">
                <button type="button" id="loadPuzzleBtn" class="btn btn-primary btn-sm">Load Puzzle</button>
                <button type="button" id="copyBoardBtn" class="btn btn-secondary btn-sm">Copy Board</button>
                <button type="button" id="closeIoBtn" class="btn btn-ghost btn-sm">Close</button>
            </div>
        </section>

        <section class="panel controls-panel" aria-label="Puzzle controls">
            <div class="control-row">
                <div class="control-group">
                    <label for="boardSize">Board Size</label>
                    <select id="boardSize">
                        <option value="4x4">4×4 (2×2 blocks)</option>
                        <option value="6x6">6×6 (2×3 blocks)</option>
                        <option value="8x8">8×8 (2×4 blocks)</option>
                        <option value="9x9" selected>9×9 (3×3 blocks)</option>
                        <option value="16x16">16×16 (4×4 hex)</option>
                        <option value="custom">Custom…</option>
                    </select>
                </div>

                <div class="control-group difficulty-group">
                    <div class="label-row">
                        <label for="difficulty">Difficulty</label>
                        <span id="difficultyLabel" class="badge">3 — Medium</span>
                    </div>
                    <input type="range" id="difficulty" min="1" max="5" value="3" step="1">
                </div>

                <div class="control-group generate-group">
                    <button type="button" id="generateProblem" class="btn btn-primary">
                        Generate Puzzle
                    </button>
                </div>
            </div>

            <div id="customConfig" class="custom-config hidden">
                <div class="control-group">
                    <label for="customSymbols">Allowed Symbols</label>
                    <input type="text" id="customSymbols" value="123456" placeholder="e.g. 123456 or A,B,C,D">
                </div>
                <div class="control-group small-input">
                    <label for="customBlockRows">Block Rows</label>
                    <input type="number" id="customBlockRows" min="1" max="16" value="2">
                </div>
                <div class="control-group small-input">
                    <label for="customBlockCols">Block Cols</label>
                    <input type="number" id="customBlockCols" min="1" max="16" value="3">
                </div>
                <div class="control-group">
                    <button type="button" id="applyCustom" class="btn btn-secondary">Apply</button>
                </div>
            </div>
        </section>

        <main class="board-stage">
            <div class="board-toolbar" aria-label="Board options">
                <div class="toolbar-group">
                    <span id="timerDisplay" class="timer-pill" aria-label="Elapsed time">00:00</span>
                    <button type="button" id="pauseBtn" class="btn btn-sm btn-ghost">Pause</button>
                </div>

                <div class="toolbar-group">
                    <button type="button" id="notesBtn" class="btn btn-sm btn-ghost" aria-pressed="false">
                        Notes: OFF
                    </button>
                    <button type="button" id="undoBtn" class="btn btn-sm btn-ghost" title="Undo (Ctrl+Z)" disabled>
                        Undo
                    </button>
                    <button type="button" id="redoBtn" class="btn btn-sm btn-ghost" title="Redo (Ctrl+Y)" disabled>
                        Redo
                    </button>
                </div>

                <label class="toggle-chip">
                    <input type="checkbox" id="conflictToggle" checked>
                    <span>Conflicts</span>
                </label>
            </div>

            <div id="boardContainer" class="board-container">
                <div class="board-wrapper">
                    <div id="sudokuBoard" class="sudoku-board" role="grid" aria-label="Sudoku board"></div>
                    <div id="pauseOverlay" class="pause-overlay hidden">
                        <span>Paused</span>
                        <button type="button" id="resumeOverlayBtn" class="btn btn-primary btn-sm">Resume</button>
                    </div>
                </div>
            </div>

            <div id="symbolPad" class="symbol-pad" aria-label="Symbol pad"></div>

            <p id="solutionMessage"
               class="status-message{% if error_message %} status-error{% endif %}"
               role="status"
               aria-live="polite">{{ error_message or '' }}</p>

            <div class="action-bar">
                <button type="button" id="checkSolution" class="btn btn-secondary">Check Solution</button>
                <button type="button" id="clearInput" class="btn btn-ghost">Clear Input</button>
                <button type="button" id="resetAll" class="btn btn-danger">Reset All</button>
            </div>

            <div class="solver-bar" aria-label="Solver controls">
                <button type="button" id="stepBtn" class="btn btn-secondary btn-sm">Next Step</button>
                <button type="button" id="animateBtn" class="btn btn-accent btn-sm">Watch Solve</button>
                <select id="animSpeed" aria-label="Animation speed">
                    <option value="900">Slow</option>
                    <option value="450" selected>Normal</option>
                    <option value="150">Fast</option>
                </select>
                <button type="button" id="solveBtn" class="btn btn-accent btn-sm">Solve All</button>
            </div>
        </main>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
